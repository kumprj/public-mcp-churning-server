name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install ruff
        run: python -m pip install 'ruff>=0.8'
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

  matrix-test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      # Install the built artifact, not an editable checkout. The private backend
      # is an optional runtime extra and is mocked by the unit suite.
      - name: Install wheel and test dependencies
        run: python -m pip install dist/*.whl 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Unit tests
        run: python -m pytest -q --import-mode=importlib

  build-and-test:
    name: build-and-test
    needs: [lint, matrix-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Status gate
        run: echo "All lint and matrix tests passed successfully."
