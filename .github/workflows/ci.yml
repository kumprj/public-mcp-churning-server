name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      # Install the built artifact, not an editable checkout. The private backend
      # is an optional runtime extra and is mocked by the unit suite.
      - name: Install wheel and test dependencies
        run: python -m pip install dist/*.whl 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Unit tests
        run: python -m pytest -q
